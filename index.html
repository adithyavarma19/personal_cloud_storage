<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudStore</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #3b82f6;
            --bg: #0f172a;
            --glass: rgba(30, 41, 59, 0.7);
            --card-inner: rgba(255, 255, 255, 0.03);
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .hidden { display: none !important; }

        .glass-container {
            width: 95%;
            max-width: 900px;
            background: var(--glass);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 40px;
        }

        /* LOGIN BOX */
        .auth-card { max-width: 380px; margin: 40px auto; text-align: center; }
        .brand { font-size: 2.5rem; font-weight: 600; color: var(--primary); margin-bottom: 8px; }
        .input-group { position: relative; margin-bottom: 15px; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-dim); }
        .input-group input {
            width: 100%; padding: 14px 15px 14px 45px; background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; outline: none; box-sizing: border-box;
        }
        .main-btn {
            width: 100%; padding: 14px; background: var(--primary); border: none; border-radius: 12px;
            color: white; font-weight: 600; cursor: pointer; transition: 0.3s;
        }

        /* DASHBOARD */
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .logout-pill {
            background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; transition: 0.3s;
        }
        .logout-pill:hover { background: var(--danger); color: white; }

        /* UPLOAD SECTION */
        .upload-card { background: var(--card-inner); padding: 24px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 40px; }
        .drop-zone-small {
            display: flex; align-items: center; gap: 15px; padding: 20px; border: 2px dashed rgba(56, 189, 248, 0.2);
            border-radius: 15px; cursor: pointer; color: var(--text-dim); transition: 0.3s;
        }
        .drop-zone-small:hover { border-color: var(--primary); background: rgba(56, 189, 248, 0.05); }
        .control-row { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        .upload-action-btn { background: var(--primary); color: white; border: none; padding: 10px 24px; border-radius: 10px; font-weight: 600; cursor: pointer; }

        .speed-metrics { display: flex; gap: 20px; margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; color: var(--text-dim); }
        .metric i { margin-right: 5px; color: var(--primary); }

        /* TOGGLE */
        .toggle-row { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: var(--text-dim); }
        .switch { position: relative; display: inline-block; width: 38px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(18px); }

        /* FILE LIST */
        .files-header { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
        .storage-badge { background: rgba(56, 189, 248, 0.1); color: var(--primary); padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .styled-list { list-style: none; padding: 0; }
        .styled-list li {
            background: var(--card-inner); margin-bottom: 10px; padding: 15px 20px; border-radius: 16px;
            display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .file-info { display: flex; align-items: center; gap: 15px; }
        .file-info b { display: block; }
        .file-info small { color: var(--text-dim); }
        .actions button {
            background: rgba(255,255,255,0.05); border: none; color: white; width: 36px; height: 36px; border-radius: 10px; margin-left: 8px; cursor: pointer;
        }
        .actions button:hover { background: var(--primary); }

        /* TOAST */
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
        .toast {
            background: var(--success); color: white; padding: 12px 24px; border-radius: 10px; margin-top: 10px;
            display: flex; align-items: center; gap: 10px; animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="glass-container">
        <div id="loginBox" class="auth-card">
            <div class="brand"><i class="fas fa-cloud-bolt"></i> Cloud Store</div>
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" placeholder="Email Address" />
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="Password" />
            </div>
            <button class="main-btn" onclick="login()">Sign In</button>
        </div>

        <div id="dashboard" class="hidden">
            <header class="header-top">
                <div class="brand-logo"><i class="fas fa-cloud-bolt"></i> CloudStore</div>
                <button class="logout-pill" onclick="logout()">Logout <i class="fas fa-sign-out-alt"></i></button>
            </header>

            <div class="upload-card">
                <label for="fileInput" class="drop-zone-small">
                    <i class="fas fa-file-circle-plus"></i>
                    <span id="fileNameDisplay">Select a file...</span>
                    <input type="file" id="fileInput" hidden onchange="updateFileNameDisplay()"/>
                </label>
                
                <div class="control-row">
                    <div class="toggle-row">
                        <label class="switch">
                            <input type="checkbox" id="accelerateToggle">
                            <span class="slider"></span>
                        </label>
                        <span>S3 Acceleration (IT costs you more for this feature)</span>
                    </div>
                    <button class="upload-action-btn" onclick="uploadFile()">Upload File</button>
                </div>

                <div class="speed-metrics">
                    <div class="metric"><i class="fas fa-arrow-up"></i> Upload: <span id="uploadSpeed">—</span></div>
                    <div class="metric"><i class="fas fa-arrow-down"></i> Download: <span id="downloadSpeed">—</span></div>
                </div>
            </div>

            <div class="files-header">
                <h3>Files</h3>
                <span class="storage-badge" id="bucketSize">Used: 0 B</span>
            </div>
            <ul id="fileList" class="styled-list"></ul>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        function updateFileNameDisplay() {
            const input = document.getElementById('fileInput');
            const display = document.getElementById('fileNameDisplay');
            if (input.files.length > 0) {
                display.innerText = "Selected: " + input.files[0].name;
                display.style.color = "#3b82f6";
            }
        }
    </script>
</body>
